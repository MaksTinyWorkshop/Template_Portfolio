services:
  # ===================================
  # Next.js Application - Développement Local
  # ===================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production

    container_name: portfolio-dev

    restart: unless-stopped

    # Exposition directe du port pour développement local
    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Variables depuis .env
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_MAILCHIMP_ACTION_URL=${NEXT_PUBLIC_MAILCHIMP_ACTION_URL:-}
      - NEXT_PUBLIC_MAILCHIMP_USER_ID=${NEXT_PUBLIC_MAILCHIMP_USER_ID:-}
      - NEXT_PUBLIC_MAILCHIMP_FORM_ID=${NEXT_PUBLIC_MAILCHIMP_FORM_ID:-}
      # GitHub API pour publication automatique
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Portfolio Admin}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-admin@portfolio.local}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/portfolio}
      # Cron secret for internal scheduled publishing
      - CRON_SECRET=${CRON_SECRET:-}

    volumes:
      # Persist uploads (if stored locally)
      - ./public/images:/app/public/images

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - backend

    depends_on:
      db-init:
        condition: service_completed_successfully

  # ===================================
  # Scheduled Publishing - Cron Runner
  # ===================================
  publish-cron:
    image: alpine:3.20
    container_name: portfolio-dev-publish-cron
    restart: unless-stopped
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - PUBLISH_DUE_INTERVAL_SECONDS=${PUBLISH_DUE_INTERVAL_SECONDS:-60}
      - NODE_ENV=development
    command:
      [
        "sh",
        "-lc",
        "apk add --no-cache curl >/dev/null 2>&1 && while true; do curl -fsS -X POST http://app:3000/api/admin/publish-due -H \"Authorization: Bearer ${CRON_SECRET}\" -o /dev/null || echo \"[publish-cron] failed\"; sleep ${PUBLISH_DUE_INTERVAL_SECONDS}; done",
      ]
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy

  # ===================================
  # Database Initializer - Migrations Prisma 7
  # ===================================
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.init

    container_name: portfolio-dev-init

    restart: "no"

    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/portfolio}
      - DB_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio}

    networks:
      - backend

    depends_on:
      db:
        condition: service_healthy

  # ===================================
  # PostgreSQL Database - Développement
  # ===================================
  db:
    image: postgres:16
    container_name: portfolio-dev-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - pgdata:/var/lib/postgresql/data

    # Exposition du port pour accès direct (ex: DBeaver, pgAdmin)
    ports:
      - "5432:5432"

    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
    driver: local
