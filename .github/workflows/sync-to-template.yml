name: Sync to Template Repository

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to sync from'
        required: true
        type: choice
        options:
          - main
          - variante_BDD
        default: 'variante_BDD'

jobs:
  sync-to-template:
    name: Sync and Create PR
    runs-on: ubuntu-latest

    steps:
      # ======================================
      # Step 1: Checkout Private Repository
      # ======================================
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch }}
          fetch-depth: 0  # Full history for better diffs

      # ======================================
      # Step 2: Setup Dependencies
      # ======================================
      - name: Setup dependencies
        run: |
          echo "::group::Installing dependencies"

          # Install gitleaks for secret scanning
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          sudo chmod +x /usr/local/bin/gitleaks

          # Install GitHub CLI (usually pre-installed on ubuntu-latest)
          if ! command -v gh &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

          # Install jq (usually pre-installed)
          if ! command -v jq &> /dev/null; then
            sudo apt-get install -y jq
          fi

          # Verify installations
          echo "✓ gitleaks version: $(gitleaks version)"
          echo "✓ gh version: $(gh --version | head -1)"
          echo "✓ jq version: $(jq --version)"

          echo "::endgroup::"

      # ======================================
      # Step 3: Determine Target Branch
      # ======================================
      - name: Determine target branch
        id: mapping
        run: |
          SOURCE="${{ github.event.inputs.source_branch }}"

          # Branch mapping: main->main, variante_BDD->database
          if [[ "$SOURCE" == "main" ]]; then
            TARGET="main"
          elif [[ "$SOURCE" == "variante_BDD" ]]; then
            TARGET="database"
          else
            echo "::error::Unknown source branch: $SOURCE"
            exit 1
          fi

          echo "source_branch=$SOURCE" >> $GITHUB_OUTPUT
          echo "target_branch=$TARGET" >> $GITHUB_OUTPUT
          echo "✓ Mapping: $SOURCE → $TARGET"

      # ======================================
      # Step 4: Setup Staging Directory
      # ======================================
      - name: Setup staging directory
        id: staging
        run: |
          STAGING_DIR="/tmp/template-staging-${{ github.run_id }}"
          mkdir -p "$STAGING_DIR"
          echo "staging_dir=$STAGING_DIR" >> $GITHUB_OUTPUT
          echo "✓ Staging directory: $STAGING_DIR"

      # ======================================
      # Step 5: Copy and Transform Files
      # ======================================
      - name: Copy and transform files
        run: |
          echo "::group::File transformation"

          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"
          SOURCE_BRANCH="${{ steps.mapping.outputs.source_branch }}"

          # Load exclude patterns from config
          source .template-sync-config

          echo "Copying files to staging directory..."

          # Copy all files except excluded ones
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='_bmad' \
            --exclude='_bmad-output' \
            --exclude='.claude' \
            --exclude='.env*' \
            --exclude='scripts/sync-to-template.sh' \
            --exclude='scripts/template-transform-rules' \
            --exclude='scripts/SYNC_TEMPLATE_README.md' \
            --exclude='.template-sync-config' \
            --exclude='src/app/(web)/resources/content.tsx' \
            --exclude='src/app/(web)/resources/content.template.tsx' \
            --exclude='.playwright-browsers' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='coverage' \
            ./ "$STAGING_DIR/"

          # Copy gitleaks config (for secret scanning with allowlist)
          if [[ -f ".gitleaks.toml" ]]; then
            cp .gitleaks.toml "$STAGING_DIR/"
            echo "✓ Copied .gitleaks.toml"
          fi

          # Apply transformations using sed on specific files
          echo "Applying transformations..."

          # Transform prisma/seed.sql if exists
          if [[ -f "$STAGING_DIR/prisma/seed.sql" ]]; then
            echo "  - Transforming prisma/seed.sql"
            sed -i.bak \
              -e "s/Maxime/YOUR_FIRST_NAME/g" \
              -e "s/Fleury/YOUR_LAST_NAME/g" \
              -e "s/contact@dinodev\.me/your.email@example.com/g" \
              -e "s/https:\/\/dinodev\.me/https:\/\/your-domain.com/g" \
              "$STAGING_DIR/prisma/seed.sql"
            rm -f "$STAGING_DIR/prisma/seed.sql.bak"
          fi

          # Transform README.md if exists
          if [[ -f "$STAGING_DIR/README.md" ]]; then
            echo "  - Transforming README.md"
            sed -i.bak \
              -e "s/contact@dinodev\.me/your.email@example.com/g" \
              -e "s/https:\/\/dinodev\.me/https:\/\/your-domain.com/g" \
              "$STAGING_DIR/README.md"
            rm -f "$STAGING_DIR/README.md.bak"
          fi

          # Replace content.tsx with template version
          if [[ -f "src/app/(web)/resources/content.template.tsx" ]]; then
            echo "  - Replacing content.tsx with template version"
            cp "src/app/(web)/resources/content.template.tsx" "$STAGING_DIR/src/app/(web)/resources/content.tsx"
          fi

          echo "✓ Transformation complete"
          echo "::endgroup::"

      # ======================================
      # Step 6: Gate 1 - Built-in Secret Scan
      # ======================================
      # Note: Already executed within sync-to-template.sh
      - name: Gate 1 - Built-in secret patterns
        run: |
          echo "✓ Gate 1 completed by sync script (see above logs)"

      # ======================================
      # Step 7: Gate 2 - Gitleaks Scan
      # ======================================
      - name: Gate 2 - Gitleaks secret scan
        run: |
          echo "::group::Gitleaks secret scan"

          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"

          # Run gitleaks on staging directory with custom config
          if gitleaks detect \
            --source "$STAGING_DIR" \
            --config "$STAGING_DIR/.gitleaks.toml" \
            --report-path gitleaks-report.json \
            --report-format json \
            --no-git \
            --exit-code 1; then
            echo "✅ Gate 2 PASSED: No secrets detected by gitleaks"
          else
            echo "::error::❌ Gate 2 FAILED: Gitleaks detected secrets!"

            # Show findings if report exists
            if [[ -f gitleaks-report.json ]]; then
              echo "Findings:"
              cat gitleaks-report.json | jq -r '.[] | "  - \(.File):\(.StartLine) - \(.Description)"' || cat gitleaks-report.json
            fi

            exit 1
          fi

          echo "::endgroup::"

      # ======================================
      # Step 8: Gate 3 - Post-Transform Validation
      # ======================================
      - name: Gate 3 - Post-transform validation
        run: |
          echo "::group::Post-transform validation"

          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"

          # Run validation script
          ./scripts/validate-sync-output.sh \
            --dir "$STAGING_DIR" \
            --verbose

          if [[ $? -eq 0 ]]; then
            echo "✅ Gate 3 PASSED: Validation successful"
            echo "validation_status=passed" >> $GITHUB_ENV
          else
            echo "::error::❌ Gate 3 FAILED: Validation found issues"
            echo "validation_status=failed" >> $GITHUB_ENV
            exit 1
          fi

          echo "::endgroup::"

      # ======================================
      # Step 9: Generate Diff Summary
      # ======================================
      - name: Generate diff summary
        id: diff
        run: |
          echo "::group::Generating diff summary"

          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"
          cd "$STAGING_DIR"

          # Initialize git for diff if not already
          if [[ ! -d .git ]]; then
            git init
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "Initial commit for diff" --no-verify
          fi

          # Count files
          FILE_COUNT=$(find . -type f ! -path "*/.git/*" ! -path "*/node_modules/*" ! -path "*/.next/*" | wc -l)
          echo "files_count=$FILE_COUNT" >> $GITHUB_OUTPUT

          # Generate diff summary
          DIFF_SUMMARY="$FILE_COUNT files staged for sync"
          echo "diff_summary=$DIFF_SUMMARY" >> $GITHUB_OUTPUT

          # Save file list
          find . -type f ! -path "*/.git/*" ! -path "*/node_modules/*" ! -path "*/.next/*" -printf "%P\n" | sort > /tmp/file-list.txt

          echo "✓ Diff summary: $DIFF_SUMMARY"
          echo "::endgroup::"

      # ======================================
      # Step 10: Upload Artifacts
      # ======================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if previous steps failed
        with:
          name: sync-artifacts-${{ github.run_id }}
          path: |
            /tmp/file-list.txt
            gitleaks-report.json
          retention-days: 30

      # ======================================
      # Step 11: Checkout Template Repository
      # ======================================
      - name: Checkout template repository
        uses: actions/checkout@v4
        with:
          repository: MaksTinyWorkshop/Template_Portfolio
          ref: ${{ steps.mapping.outputs.target_branch }}
          token: ${{ secrets.TEMPLATE_REPO_PAT }}
          path: template-repo

      # ======================================
      # Step 12: Copy Staged Files to Template Repo
      # ======================================
      - name: Copy files to template repository
        run: |
          echo "::group::Copying files"

          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"

          # Remove existing files (except .git)
          cd template-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy all files from staging using rsync (more reliable than cp)
          rsync -av \
            --exclude='.git' \
            "$STAGING_DIR/" \
            ./

          echo "✓ Files copied to template-repo/"
          echo "::endgroup::"

      # ======================================
      # Step 13: Commit and Push to Template Repo
      # ======================================
      - name: Commit and push changes
        run: |
          cd template-repo

          # Configure git
          git config user.name "MaksTinyWorkshop"
          git config user.email "noreply@github.com"

          # Stage all changes
          git add -A

          # Check if there are changes
          if git diff --staged --quiet; then
            echo "::notice::No changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            # Commit changes
            COMMIT_MSG="sync: Update from ${{ steps.mapping.outputs.source_branch }} ($(date +%Y-%m-%d))"
            git commit -m "$COMMIT_MSG"

            # Push to a new branch
            SYNC_BRANCH="${{ steps.mapping.outputs.target_branch }}-sync-${{ github.run_id }}"
            git checkout -b "$SYNC_BRANCH"
            git push origin "$SYNC_BRANCH"

            echo "has_changes=true" >> $GITHUB_ENV
            echo "sync_branch=$SYNC_BRANCH" >> $GITHUB_ENV
            echo "✓ Pushed to branch: $SYNC_BRANCH"
          fi

      # ======================================
      # Step 14: Create Pull Request
      # ======================================
      - name: Create Pull Request
        if: env.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          cd template-repo

          # PR details
          PR_TITLE="sync: Update from ${{ steps.mapping.outputs.source_branch }} ($(date +%Y-%m-%d))"

          # Create PR body
          cat > pr-body.md <<EOF
          ## 🔄 Automated Template Sync

          This PR synchronizes changes from the private portfolio repository.

          ### 📊 Summary

          - **Source branch:** \`${{ steps.mapping.outputs.source_branch }}\`
          - **Target branch:** \`${{ steps.mapping.outputs.target_branch }}\`
          - **Files:** ${{ steps.diff.outputs.files_count }} files synchronized

          ### 🔒 Security Validation

          **Quality Gates:** ✅ **PASSED**

          - ✅ Gate 1: Pattern-based secret scan
          - ✅ Gate 2: Gitleaks secret detection
          - ✅ Gate 3: Post-transform validation
          - ✅ Gate 4: Critical files verification

          ### 🔗 Workflow Run

          [View full workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ### ✅ Next Steps

          1. **Review** the changes in this PR
          2. **Verify** no sensitive data leaked (double-check!)
          3. **Merge** if everything looks good
          4. **Close** if issues found (fix in private repo and re-sync)

          ---

          🤖 **Automated sync** from \`${{ steps.mapping.outputs.source_branch }}\` branch • Generated on $(date +%Y-%m-%d)
          EOF

          # Create PR
          gh pr create \
            --repo MaksTinyWorkshop/Template_Portfolio \
            --base "${{ steps.mapping.outputs.target_branch }}" \
            --head "${{ env.sync_branch }}" \
            --title "$PR_TITLE" \
            --body-file pr-body.md

          echo "✅ Pull Request created successfully!"

      # ======================================
      # Step 15: Cleanup
      # ======================================
      - name: Cleanup
        if: always()
        run: |
          echo "::group::Cleanup"

          # Remove staging directory
          STAGING_DIR="${{ steps.staging.outputs.staging_dir }}"
          if [[ -d "$STAGING_DIR" ]]; then
            rm -rf "$STAGING_DIR"
            echo "✓ Removed staging directory"
          fi

          echo "::endgroup::"

      # ======================================
      # Step 16: Summary
      # ======================================
      - name: Job summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # Sync to Template - Summary

          ## Configuration
          - **Source branch:** \`${{ steps.mapping.outputs.source_branch }}\`
          - **Target branch:** \`${{ steps.mapping.outputs.target_branch }}\`

          ## Validation Results
          - Gate 1: Pattern-based scan ✅
          - Gate 2: Gitleaks scan ✅
          - Gate 3: Post-transform validation ✅

          ## Files
          - **Count:** ${{ steps.diff.outputs.files_count }} files

          ## Status
          - **Changes:** ${{ env.has_changes || 'unknown' }}
          - **PR Branch:** \`${{ env.sync_branch || 'N/A' }}\`

          ---

          View [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed logs.
          EOF
